<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ayrton Silva</title>
<style>
  /*{{FONTS}}*/

  /* Ayrton Silva — editorial mono.
     Deliberately NOT IDEPUB violet and NOT IDEMMO rainbow: this is a person,
     not a company channel. Warm off-white, near-black, one accent.
     Public track = editorial red. Trade track = slate. Same system either way. */

  :root {
    --paper:#faf8f4; --ink:#16150f; --ink-2:#57534a; --ink-3:#8f887c;
    --rule:#e2dcd2; --card:#fffefc;
    --accent:#a33327;          /* public */
    --accent-trade:#2f4a58;    /* trade  */
  }
  .post.trade { --accent:var(--accent-trade); }

  @page { margin:0 }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e8e3da; font-family:"Archivo","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

  .post {
    position:relative; width:1080px; height:1350px; background:var(--paper);
    overflow:hidden; padding:72px 76px 58px; display:flex; flex-direction:column; margin:0 auto 40px;
  }

  /* masthead */
  header { display:flex; align-items:baseline; justify-content:space-between;
           border-bottom:2px solid var(--ink); padding-bottom:16px; }
  .name { font-family:"Newsreader",Georgia,serif; font-size:31px; font-weight:600;
          letter-spacing:-.3px; color:var(--ink); }
  .name b { font-weight:700; }
  .kicker { font-size:15px; font-weight:700; letter-spacing:2.6px; text-transform:uppercase;
            color:var(--ink-3); text-align:right; line-height:1.5; }
  .kicker span { color:var(--accent); }

  /* copy */
  .rubric { margin-top:34px; font-size:16px; font-weight:700; letter-spacing:2.8px;
            text-transform:uppercase; color:var(--accent); }
  h1 { margin-top:16px; font-family:"Newsreader",Georgia,serif; font-weight:600;
       font-size:74px; line-height:1.04; letter-spacing:-1.6px; color:var(--ink); }
  h1 em { font-style:italic; font-weight:600; }
  .standfirst { margin-top:20px; font-family:"Newsreader",Georgia,serif; font-size:27px;
                line-height:1.42; color:var(--ink-2); max-width:850px; }

  /* the figure */
  .figure-block { margin-top:auto; margin-bottom:auto; padding:14px 0; }
  .fig { display:flex; align-items:baseline; gap:14px; flex-wrap:nowrap; }
  .fig .n { font-family:"Newsreader",Georgia,serif; font-weight:700; font-size:190px;
            line-height:.86; letter-spacing:-6px; color:var(--accent); white-space:nowrap; }
  .fig .u { font-size:44px; font-weight:600; color:var(--ink-3); letter-spacing:-.5px;
            white-space:nowrap; }
  /* longer figures step down so nothing wraps */
  .fig.long .n { font-size:138px; letter-spacing:-4px; }
  .fig.long .u { font-size:34px; }
  .fig.xlong .n { font-size:112px; letter-spacing:-3px; }
  .fig.xlong .u { font-size:30px; }
  .fig-note { margin-top:22px; font-size:26px; line-height:1.42; color:var(--ink); max-width:820px; }

  /* data rows */
  .rows { margin-top:30px; border-top:1px solid var(--rule); }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:24px;
         padding:17px 0; border-bottom:1px solid var(--rule); }
  .row .k { font-size:23px; color:var(--ink-2); }
  .row .v { font-size:24px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row .v.hi { color:var(--accent); }

  /* numbered method */
  .method { margin-top:28px; display:flex; flex-direction:column; gap:0; border-top:1px solid var(--rule); }
  .step { display:flex; gap:24px; padding:20px 0; border-bottom:1px solid var(--rule); }
  .step .n { flex:none; width:44px; font-family:"Newsreader",Georgia,serif; font-size:30px;
             font-weight:700; color:var(--accent); line-height:1.1; }
  .step h3 { font-size:25px; font-weight:700; color:var(--ink); letter-spacing:-.2px; }
  .step p { margin-top:4px; font-size:22px; line-height:1.4; color:var(--ink-2); }

  /* screen / image slot */
  .screen { margin-top:26px; border:1px solid var(--rule); border-radius:4px; overflow:hidden;
            background:var(--card); }
  .screen img { display:block; width:100%; height:100%; object-fit:cover; }
  .screen-cap { margin-top:10px; font-size:18px; color:var(--ink-3); letter-spacing:.2px; }

  /* pull quote / statement */
  .statement { margin-top:26px; padding-left:24px; border-left:3px solid var(--accent);
               font-family:"Newsreader",Georgia,serif; font-size:31px; line-height:1.34;
               color:var(--ink); }

  /* figure posts centre the number in the space left by the copy */
  .post:has(.figure-block) .spacer { display:none; }

  /* data-led posts let the table breathe into the page instead of
     leaving a void above the footer */
  .post:not(:has(.figure-block)):has(.rows) .spacer { display:none; }
  .post:not(:has(.figure-block)) .rows { flex:1; display:flex; flex-direction:column; }
  .post:not(:has(.figure-block)) .rows .row { flex:1; }

  .spacer { flex:1; }

  /* footer */
  footer { margin-top:26px; padding-top:16px; border-top:1px solid var(--ink);
           display:flex; align-items:baseline; justify-content:space-between; gap:26px; }
  .source { font-size:17px; line-height:1.45; color:var(--ink-3); max-width:720px; }
  .source b { color:var(--ink-2); font-weight:700; }
  .handle { font-size:17px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
            color:var(--ink-3); white-space:nowrap; }
</style>
</head>
<body>
<!-- Generated by src/render.mjs from src/data.js. Edit copy in data.js. -->
<div id="app"><!--{{BODY}}--></div>
</body>
</html>
