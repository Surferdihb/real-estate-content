<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ayrton Silva — rapport</title>
<style>
  /*{{FONTS}}*/

  /* Ayrton Silva — A4 lead-magnet documents.
     Same editorial identity as the posts: paper, ink, one red accent.
     Built for Playwright print-to-PDF; every .page is one A4 sheet. */

  :root {
    --paper:#faf8f4; --ink:#16150f; --ink-2:#57534a; --ink-3:#8f887c;
    --rule:#e2dcd2; --accent:#a33327;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  @page { size: A4; margin: 0; }
  body { font-family:"Archivo",system-ui,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  .page {
    width:210mm; height:296mm; background:var(--paper);
    padding:18mm 17mm 14mm; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    page-break-after:always; break-after:page;
  }
  .page:last-child { page-break-after:auto; break-after:auto; }

  /* running header/footer on content pages */
  .runhead { display:flex; justify-content:space-between; align-items:baseline;
             border-bottom:1.6px solid var(--ink); padding-bottom:4mm; }
  .runhead .name { font-family:"Newsreader",Georgia,serif; font-size:13pt; font-weight:600; color:var(--ink); }
  .runhead .name b { font-weight:700; }
  .runhead .doc { font-size:7.5pt; font-weight:700; letter-spacing:1.6pt; text-transform:uppercase; color:var(--ink-3); }
  .runfoot { margin-top:auto; padding-top:4mm; border-top:0.4pt solid var(--rule);
             display:flex; justify-content:space-between; font-size:7pt; color:var(--ink-3); }
  .runfoot .pg { font-weight:700; }

  /* ---- cover ---- */
  .cover { justify-content:flex-start; }
  .cover .kicker { margin-top:22mm; font-size:9pt; font-weight:700; letter-spacing:3pt;
                   text-transform:uppercase; color:var(--accent); }
  .cover h1 { margin-top:8mm; font-family:"Newsreader",Georgia,serif; font-weight:700;
              font-size:38pt; line-height:1.02; letter-spacing:-0.8pt; color:var(--ink); }
  .cover .sub { margin-top:8mm; font-family:"Newsreader",Georgia,serif; font-size:13.5pt;
                line-height:1.45; color:var(--ink-2); max-width:150mm; }
  .cover .band { margin-top:12mm; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
                 display:flex; }
  .cover .band div { flex:1; padding:6mm 4mm; border-right:1px solid var(--rule); }
  .cover .band div:last-child { border-right:0; }
  .cover .band .v { font-family:"Newsreader",Georgia,serif; font-size:19pt; font-weight:700; color:var(--accent); }
  .cover .band .k { margin-top:1.5mm; font-size:7.5pt; letter-spacing:0.8pt; text-transform:uppercase; color:var(--ink-3); }
  .cover .author { margin-top:auto; }
  .cover .author .who { font-family:"Newsreader",Georgia,serif; font-size:14pt; font-weight:600; color:var(--ink); }
  .cover .author .what { margin-top:1.5mm; font-size:9pt; color:var(--ink-2); }
  .cover .author .date { margin-top:4mm; font-size:8pt; color:var(--ink-3); }

  /* ---- content blocks ---- */
  .rubric { margin-top:9mm; font-size:8.5pt; font-weight:700; letter-spacing:2.4pt;
            text-transform:uppercase; color:var(--accent); }
  h2 { margin-top:3mm; font-family:"Newsreader",Georgia,serif; font-weight:600;
       font-size:23pt; line-height:1.08; letter-spacing:-0.4pt; color:var(--ink); }
  .lede { margin-top:4mm; font-family:"Newsreader",Georgia,serif; font-size:11.5pt;
          line-height:1.5; color:var(--ink-2); }
  p.body { margin-top:4mm; font-size:9.5pt; line-height:1.55; color:var(--ink); }

  table { margin-top:6mm; width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:7.5pt; letter-spacing:1pt; text-transform:uppercase;
       color:var(--ink-3); font-weight:700; padding:0 2mm 2.5mm 0; border-bottom:1px solid var(--ink); }
  th.num, td.num { text-align:right; }
  td { padding:3.2mm 2mm 3.2mm 0; border-bottom:0.4pt solid var(--rule);
       font-size:9.5pt; color:var(--ink); vertical-align:baseline; }
  td.k { color:var(--ink-2); }
  td b { font-weight:700; }
  td .hi { color:var(--accent); font-weight:700; }

  .statement { margin-top:7mm; padding-left:5mm; border-left:1.2mm solid var(--accent);
               font-family:"Newsreader",Georgia,serif; font-size:12.5pt; line-height:1.4; color:var(--ink); }

  .note { margin-top:5mm; font-size:8pt; line-height:1.5; color:var(--ink-3); }
  .note b { color:var(--ink-2); }

  .two-col { display:flex; gap:8mm; margin-top:6mm; }
  .two-col > div { flex:1; }

  /* figure block for chapter pages */
  .bigfig { margin-top:8mm; display:flex; align-items:baseline; gap:3mm; }
  .bigfig .n { font-family:"Newsreader",Georgia,serif; font-weight:700; font-size:44pt;
               letter-spacing:-1pt; color:var(--accent); }
  .bigfig .u { font-size:12pt; font-weight:600; color:var(--ink-3); }
</style>
</head>
<body>
<!--{{BODY}}-->
</body>
</html>
